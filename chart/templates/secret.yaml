{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "venturebell.fullname" . }}
  labels:
    {{- include "venturebell.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.secret.bellToken }}
  {{- fail "set either existingSecret or secret.bellToken — the server refuses to start without BELL_TOKEN" }}
  {{- end }}
  BELL_TOKEN: {{ .Values.secret.bellToken | quote }}
{{- end }}
